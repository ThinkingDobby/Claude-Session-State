<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Session State</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <div class="title-row">
    <h1>Claude 세션 상태</h1>
    <span id="conn-dot" class="dot dot-connecting" title="연결 상태"></span>
  </div>
  <div class="toolbar">
    <div class="filters" id="filters">
      <button data-filter="all" class="active">전체</button>
      <button data-filter="busy">작업 중</button>
      <button data-filter="waiting">입력 필요</button>
      <button data-filter="idle">대기 중</button>
      <button data-filter="other">기타</button>
    </div>
    <div class="toolbar-right">
      <span id="last-updated" class="muted">-</span>
      <button id="settings-btn" class="ghost-btn">⚙️ 설정</button>
    </div>
  </div>
</header>

<main>
  <div id="error-banner" class="error-banner" hidden></div>
  <div id="empty-state" class="empty-state" hidden>표시할 세션이 없습니다.</div>
  <div id="grid" class="grid"></div>
  <div id="kanban" class="kanban" hidden></div>
</main>

<dialog id="settings-dialog" class="settings-dialog">
  <div class="settings-header">
    <h2>설정</h2>
    <button id="settings-close-btn" class="icon-btn" aria-label="닫기">✕</button>
  </div>
  <div class="settings-row">
    <div class="settings-row-text">
      <span class="settings-row-title">알림</span>
      <span class="settings-row-desc">작업 완료 시 브라우저 알림을 받습니다.</span>
    </div>
    <button id="notify-btn" class="ghost-btn">🔔 알림 허용</button>
  </div>
  <div class="settings-row">
    <div class="settings-row-text">
      <span class="settings-row-title">칸반 보기</span>
      <span class="settings-row-desc">"전체" 탭에서 상태별 컬럼으로 나눠 보여줍니다.</span>
    </div>
    <button id="kanban-toggle" class="ghost-btn">🗂 칸반 보기 켜짐</button>
  </div>
  <div class="settings-row">
    <div class="settings-row-text">
      <span class="settings-row-title">서버</span>
      <span class="settings-row-desc">대시보드 서버를 재시작합니다. 완료되면 페이지가 새로고침됩니다.</span>
    </div>
    <button id="restart-btn" class="ghost-btn">🔄 서버 재시작</button>
  </div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
